{% extends "base.html" %}
{% block title %}Login · FlowCyto{% endblock %}

{% block content %}
<section class="card">
  <h1>Welcome</h1>
  <p class="muted">Log in to use the cell-type predictor.</p>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-row">
      <label for="email">User email</label>
      <input type="email" id="email" name="email" placeholder="name@domain.com" required>
    </div>

    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>

    {% if error %}
      <p class="muted" style="margin-top:14px;">{{ error }}</p>
    {% endif %}

    <div class="actions">
      <button type="submit">Log in</button>
    </div>

    <p style="margin-top: 20px; text-align: center;">
        Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
    </p>
  </form>
</section>
{% endblock %}
