<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FlowCyto{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>

<body>
  <div class="side side-left" aria-hidden="true"></div>
  <div class="side side-right" aria-hidden="true"></div>

  <div class="page">
    <header class="header header-center">
      <a class="brand" href="{{ url_for('home') }}">
        <img class="brand-logo"
            src="{{ url_for('static', filename='img/logo.jpeg') }}"
            alt="FlowCyto logo">

      </a>
    </header>


    <main class="main">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <span>FlowCyto Predictor · by DINP</span>
    </footer>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
