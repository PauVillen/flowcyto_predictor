{% extends "base.html" %}
{% block title %}Register · FlowCyto{% endblock %}

{% block content %}
<section class="card">
  <h1>Sign Up</h1>
  <p class="muted">Create a new account.</p>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="form-row">
      <label for="email">User email</label>
      <input type="email" id="email" name="email" placeholder="name@domain.com" required>
    </div>

    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Choose a password" required>
    </div>

    {% if error %}
      <p class="muted" style="color: red; margin-top:14px;">{{ error }}</p>
    {% endif %}

    <div class="actions">
      <button type="submit">Create Account</button>
    </div>
    
    <p style="margin-top: 20px; text-align: center;">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </form>
</section>
{% endblock %}
