{% extends "layout.html" %}

{% block content %}
<div class="page-dark">
    <main class="main">
        <section class="card-dark">
            <h1>Create Your New Account</h1>
            <p class="muted">Join FlowCyto to start analyzing genes.</p>

            <form method="POST" action="{{PREFIX}}{{ url_for('register') }}">
                <div class="form-row">
                    <label for="email">User email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min. 8 characters" required>
                </div>

                {% if error %}
                    <p style="color: #ff0000; font-size: 0.85rem; text-align: center; margin-top: 10px;">
                        {{ error }}
                    </p>
                {% endif %}

                <div class="actions">
                    <button type="submit" class="btn-red">Sign up</button>
                </div>

                <p class="muted" style="color:aliceblue ; margin-top: 25px;">
                    You already have an account? 
                    <a href="{{PREFIX}}{{ url_for('login') }}" style="color: #ff0000; text-decoration: none;">Log in</a>
                </p>
            </form>
        </section>
    </main>
</div>
{% endblock %}
